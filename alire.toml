name = "hilbert"
description = "Hybrid Item List for Binary Evaluation and Test"
version = "0.1.0-dev"

authors = ["Francesc Rocher"]
maintainers = ["Francesc Rocher <francesc.rocher@gmail.com>"]
maintainers-logins = ["rocher"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = ["evaluation", "test"]

executables = ["hilbert"]

[build-switches]
"*".Ada_Version = ["-gnat2022", "-gnatX0"]
"*".Contracts = "Yes"
"*".Source_Encoding = "utf_8"
"*".Style_Checks = "Yes"

[[depends-on]]
clic = "~0.3.0"
simple_logging = "^1.2.0"
